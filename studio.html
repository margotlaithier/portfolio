<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script defer src="https://cloud.umami.is/script.js" data-website-id="e263ec8e-6564-4bc0-a2e1-000fcb402363"></script>
    <title>Studio portfolio</title>
    <link rel="icon" href="logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="cms/studio.css?v=20260827-8" />
</head>
<body class="studio-page">
    <div id="studio-app"></div>
    <script>
        (async () => {
            const loadScript = (source) => new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = `${source}?v=${Date.now()}`;
                script.onload = resolve;
                script.onerror = reject;
                document.body.appendChild(script);
            });

            await loadScript('cms/portfolio-content.js');
            await loadScript('cms/studio.js');
        })().catch((error) => {
            console.error('Impossible de charger le Studio.', error);
            document.getElementById('studio-app').textContent = 'Impossible de charger le Studio. Recharge la page.';
        });
    </script>
</body>
</html>
