<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studio portfolio</title>
    <link rel="icon" href="logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;700&display=swap" />
    <link rel="stylesheet" href="cms/studio.css" />
</head>
<body class="studio-page">
    <div id="studio-app"></div>
    <script>
        (async () => {
            const loadScript = (source) => new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = `${source}?v=${Date.now()}`;
                script.onload = resolve;
                script.onerror = reject;
                document.body.appendChild(script);
            });

            await loadScript('cms/portfolio-content.js');
            await loadScript('cms/studio.js');
        })().catch((error) => {
            console.error('Impossible de charger le Studio.', error);
            document.getElementById('studio-app').textContent = 'Impossible de charger le Studio. Recharge la page.';
        });
    </script>
</body>
</html>
